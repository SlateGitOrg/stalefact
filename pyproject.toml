[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stalefact"
version = "0.1.0"
description = "Conversation memory strategies for multi-call insurance claims, compared on fact retention per memory token with stale answers counted as failures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "stalefact contributors" }]
keywords = ["llm-memory", "conversational-ai", "summarization", "llm-evaluation", "insurance"]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
stalefact = "stalefact.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stalefact"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = ["live: calls a real OpenAI-compatible endpoint; needs STALEFACT_LIVE=1"]
